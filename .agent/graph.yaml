name: software-assignment
version: 1
initial: intake
terminal: complete

nodes:
  intake:
    purpose: Capture the request, assignment identifier, and initial constraints.
    next: [classify]
  classify:
    purpose: Classify the task as feature, bugfix, investigation, refactor, documentation, or review.
    next: [context]
  context:
    purpose: Inspect the issue, repository, relevant code, documentation, history, and current branch.
    next: [outcome]
  outcome:
    purpose: Record acceptance criteria, assumptions, and the definition of done.
    next: [plan]
  plan:
    purpose: Identify files, implementation steps, risks, and verification strategy.
    next: [implement]
  implement:
    purpose: Make the smallest coherent change that satisfies the recorded outcome.
    next: [verify]
  verify:
    purpose: Run automated and manual checks and record evidence.
    next: [review, implement]
  review:
    purpose: Independently inspect the final diff for correctness, regressions, scope, and missing evidence.
    next: [deliver, implement]
  deliver:
    purpose: Produce a PR-ready summary with changes, verification, risks, and remaining steps.
    next: [complete]
  complete:
    purpose: Mark the assignment complete after delivery evidence exists.
    next: []

guards:
  outcome_to_plan:
    requires:
      - at_least_one_acceptance_criterion
  verify_to_review:
    requires:
      - at_least_one_passing_verification
      - no_failing_verifications
  review_to_deliver:
    requires:
      - review_summary
  deliver_to_complete:
    requires:
      - delivery_summary

---
name: software-batch
version: 1
initial: intake
terminal: complete

nodes:
  intake:
    purpose: Capture the batch identifier, ordered ticket list, and overall goal.
    next: [plan]
  plan:
    purpose: Plan ordering, dependencies, risks, and verification strategy across tickets. Loop here until the plan is solid.
    next: [plan, execute]
  execute:
    purpose: Sequentially drive each incomplete ticket through the assignment graph. Advance the cursor only after the current ticket is complete or skipped.
    next: [execute, complete]
  complete:
    purpose: Mark the batch complete after every ticket is complete or skipped.
    next: []

guards:
  intake_to_plan:
    requires:
      - at_least_one_assignment_id
  plan_to_plan:
    requires:
      - planning_revision_note
  plan_to_execute:
    requires:
      - batch_plan_summary
  execute_to_execute:
    requires:
      - current_assignment_complete_or_skipped
  execute_to_complete:
    requires:
      - all_assignments_complete_or_skipped
